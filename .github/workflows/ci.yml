name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lee los ficheros cambiados de la PR

# Un push nuevo a la misma PR o rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Decide qué jobs hay que lanzar. Los filtros van aquí y no en `on.paths`
  # porque un check obligatorio que no se lanza se queda "pendiente" para siempre
  # y bloquea la PR; un job saltado con `if` cuenta como superado.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      backend_image: ${{ steps.decide.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v4

      # Solo en PRs. En push a develop/main (después de un merge) y en ejecuciones
      # manuales se lanza todo: "cada merge se compila".
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

      - id: decide
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
        run: |
          backend=false; frontend=false; backend_image=false
          if [ -f backend/pyproject.toml ] && { [ "$IS_PR" != true ] || [ "$BACKEND_CHANGED" = true ]; }; then
            backend=true
            [ -f backend/Dockerfile ] && backend_image=true
          fi
          if [ -f frontend/package.json ] && { [ "$IS_PR" != true ] || [ "$FRONTEND_CHANGED" = true ]; }; then
            frontend=true
          fi
          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "backend_image=$backend_image"
          } >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend backend_image=$backend_image"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      MEDIA_BUCKET: es-b2-media-891377256343
      MEDIA_BASE_URL: /media
      AWS_REGION: eu-west-1
      SECRET_KEY: ci-no-es-secreto
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      - name: Migraciones (alembic upgrade head)
        if: hashFiles('backend/alembic.ini') != ''
        run: alembic upgrade head

      # El mínimo de cobertura está en pyproject.toml ([tool.coverage.report] fail_under).
      - name: pytest + cobertura
        run: pytest --cov=app --cov-report=term --cov-report=xml

      - name: Resumen de cobertura
        if: always()
        run: |
          [ -f .coverage ] || exit 0
          {
            echo "### Cobertura backend"
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('backend/coverage.xml') != ''
        with:
          name: coverage-backend
          path: backend/coverage.xml
          retention-days: 7

  # Comprueba que el Dockerfile construye para arm64 (la arquitectura de la EC2 t4g).
  # No sube la imagen; eso lo hacen los workflows de despliegue.
  backend-image:
    needs: changes
    if: needs.changes.outputs.backend_image == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: docker build (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Según el acuerdo, `npm test` ejecuta vitest sin watch y con cobertura.
      - run: npm test
      - run: npm run build

      - name: Resumen de cobertura
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = k => `| ${k} | ${t[k].pct} % |`;
            console.log(["### Cobertura frontend", "| Métrica | % |", "|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
